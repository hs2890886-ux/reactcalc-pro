<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101827"><title>ReactCalc Pro</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#121c2e;--btn:#1e2a40;--accent:#55d6be;--text:#f5f7fb;--muted:#9aabc4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1b3150,var(--bg) 60%);font-family:system-ui,sans-serif;color:var(--text);display:grid;place-items:center;padding:18px}.app{width:min(100%,420px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}h1{font-size:1.25rem;margin:0}h1 span{color:var(--accent)}.tag{font-size:.72rem;color:var(--accent);border:1px solid #286b67;border-radius:99px;padding:5px 9px}.calc{background:rgba(18,28,46,.96);border:1px solid #26364e;border-radius:24px;padding:18px;box-shadow:0 20px 60px #0005}.display{min-height:125px;padding:14px 8px 20px;text-align:right;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}.history{min-height:25px;color:var(--muted);font-size:.95rem;overflow-wrap:anywhere}.result{font-size:clamp(2rem,9vw,3rem);font-weight:650;overflow-wrap:anywhere;line-height:1.2}.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.key{border:0;border-radius:15px;background:var(--btn);color:var(--text);font-size:1.15rem;min-height:59px;cursor:pointer;touch-action:manipulation}.key:active{filter:brightness(1.3);transform:scale(.97)}.utility{color:var(--accent);background:#193c46}.op{background:#263852}.equals{background:var(--accent);color:#08211f;font-weight:800}.wide{grid-column:span 2}.tools{display:flex;gap:8px;margin-top:10px}.tools button{flex:1;background:transparent;border:1px solid #31435d;color:var(--muted);border-radius:10px;padding:9px;cursor:pointer}footer{color:var(--muted);font-size:.78rem;text-align:center;margin-top:14px;line-height:1.5}@media(max-width:360px){.calc{padding:12px}.keys{gap:7px}.key{min-height:53px}}
</style></head><body><main class="app"><header><h1>ReactCalc <span>Pro</span></h1><span class="tag">CALCULATOR</span></header>
<section class="calc" aria-label="Calculator"><div class="display" aria-live="polite"><div id="history" class="history"></div><div id="display" class="result">0</div></div>
<div class="keys">
<button class="key utility" data-action="clear">AC</button><button class="key utility" data-action="sign">+/−</button><button class="key utility" data-action="percent">%</button><button class="key op" data-value="/">÷</button>
<button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key op" data-value="*">×</button>
<button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key op" data-value="-">−</button>
<button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key op" data-value="+">+</button>
<button class="key wide" data-value="0">0</button><button class="key" data-action="decimal">.</button><button class="key equals" data-action="equals">=</button></div>
<div class="tools"><button id="backspace">⌫ Delete</button><button id="copy">Copy result</button></div></section><footer>Works in your browser. No account or payment required.</footer></main>
<script>
(()=>{const display=document.getElementById('display'),history=document.getElementById('history');let current='0',stored=null,operator=null,replace=false;
const fmt=n=>{if(!Number.isFinite(n))return 'Error';if(Object.is(n,-0))n=0;return String(Number(n.toPrecision(12)))};
const render=()=>display.textContent=current;const reset=()=>{current='0';stored=null;operator=null;replace=false;history.textContent='';render()};
const input=v=>{if(current==='Error'||replace){current=v;replace=false}else if(current==='0')current=v;else if(current.length<18)current+=v;render()};
const calc=(a,o,b)=>o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:o==='/'?(b===0?NaN:a/b):b;
const choose=o=>{const n=Number(current);if(!Number.isFinite(n))return;if(operator&&!replace){stored=calc(stored,operator,n);current=fmt(stored)}else stored=n;operator=o;replace=true;history.textContent=fmt(stored)+' '+o;render()};
const equals=()=>{if(operator===null||stored===null)return;const a=stored,o=operator,b=Number(current);history.textContent=fmt(a)+' '+o+' '+fmt(b)+' =';current=fmt(calc(a,o,b));stored=null;operator=null;replace=true;render()};
document.querySelectorAll('[data-value]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.value;if('0123456789'.includes(v)&&v.length===1)input(v);else if(['+','-','*','/'].includes(v))choose(v)}));
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{switch(b.dataset.action){case'clear':reset();break;case'decimal':if(current==='Error'||replace){current='0.';replace=false}else if(!current.includes('.'))current+='.';render();break;case'sign':if(current!=='0'&&current!=='Error')current=fmt(-Number(current));render();break;case'percent':if(current!=='Error')current=fmt(Number(current)/100);render();break;case'equals':equals();break}}));
document.getElementById('backspace').addEventListener('click',()=>{if(replace||current==='Error'){current='0';replace=false}else current=current.length>1?current.slice(0,-1):'0';render()});
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(current);history.textContent='Result copied'}catch(e){history.textContent='Select and copy result manually'}});
document.addEventListener('keydown',e=>{if(/^[0-9]$/.test(e.key))input(e.key);else if(['+','-','*','/'].includes(e.key))choose(e.key);else if(e.key==='Enter'||e.key==='=')equals();else if(e.key==='.')document.querySelector('[data-action="decimal"]').click();else if(e.key==='Escape')reset();else if(e.key==='Backspace')document.getElementById('backspace').click()});render()})();
</script></body></html>
